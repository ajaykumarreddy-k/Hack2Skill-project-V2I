version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: v2i_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  auth-service:
    build: ./auth
    ports:
      - "8081:8080"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/v2i_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=change_me_in_production
    depends_on:
      - db
      - redis

  core-api:
    build: ./core
    ports:
      - "8082:8080"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/v2i_db
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
