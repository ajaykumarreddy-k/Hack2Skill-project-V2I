[project]
name = "v2i-backend"
version = "0.1.0"
description = "V2I — Vote 2 India · Backend Services (Core API + AI Engine)"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
    # ── Core API (FastAPI) ──────────────────────────────────────────────────
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.1",
    "asyncpg>=0.29.0",
    "redis>=5.0.3",
    "python-dotenv>=1.0.1",
    "pydantic>=2.6.3",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # ── AI Engine ───────────────────────────────────────────────────────────
    "langchain>=0.1.12",
    "langchain-openai>=0.0.8",
    "langchain-google-genai>=1.0.0",
    "openai>=1.14.0",
    "google-generativeai>=0.5.0",
    "PyMuPDF>=1.23.26",
    "pdfplumber>=0.11.0",
    # ── Storage ─────────────────────────────────────────────────────────────
    "google-cloud-storage>=2.15.0",
    "boto3>=1.34.0",           # Cloudflare R2 (S3-compatible)
    # ── Utilities ───────────────────────────────────────────────────────────
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

# To run the API, use: uv run python -m core.main

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["core", "ai"]
