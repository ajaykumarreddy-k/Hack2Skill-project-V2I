name: CI/CD Quality Audit

on:
  push:
    branches: [ VotingCallange, main ]
  pull_request:
    branches: [ VotingCallange, main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
      
    - name: Install dependencies
      run: |
        cd backend
        uv sync
        
    - name: Run Ruff (Linter)
      run: |
        cd backend
        uv run ruff check .
        
    - name: Run Pytest (Testing Suite)
      run: |
        cd backend
        uv run pytest
